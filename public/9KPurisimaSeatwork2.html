      position: absolute;
      top: 66px;
      left: 190px;
    }  
    .notice {
    position: absolute;
    top: 60px;
    left: 400px;
    background: orange;
    padding: 10px;
    z-index: 2;

    position: absolute;
    right: 0px;
    max-width: 70px;
    }

  </style>
</head>

  <div class="header">Header</div>
  <div class="sidebar">Sidebar</div>
